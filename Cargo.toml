[workspace]
resolver = "3"
members = ["crates/spark-core", "crates/mcf-linter-spark"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
spark-core = { path = "crates/spark-core" }
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
